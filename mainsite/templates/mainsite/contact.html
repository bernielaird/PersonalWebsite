{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <script src="{% static 'mainsite/theme.js' %}" defer></script>
    <link rel="preload" href="{% static 'fonts/tstar-mono-round.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'mainsite/styles.css' %}">
    <link rel="icon" href="{% static 'images/foxv1.png' %}" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Contact{% endblock %}</title>
</head>
<body class="page-layout">
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode"></button>
    <header>
        <div class="title">
            <h1>contact</h1>
        </div>
    </header>

    <main>
        {% block content %}
    <div class="paragraphs">
        <div class="contact-item-top">
            <div class="contact-label">Email</div>
            <div class="contact-value"><a href="mailto:asovace@gmail.com">asovace@gmail.com</a></div>
        </div>

        <div class="contact-item">
            <div class="contact-label">LinkedIn</div>
            <div class="contact-value"><a href="https://www.linkedin.com/in/bernie-laird/">Bernie Laird</a></div>
        </div>

        <div class="contact-item">
            <div class="contact-label">GitHub</div>
            <div class="contact-value"><a href="https://github.com/bernielaird">bernielaird</a></div>
        </div>
    </div>
        {% endblock %}
    </main>
    <footer class="bottom-bar">
        <div class="bottom-left">
            <a href="/">home</a>
            <a href="/about/">about</a>
            <a href="/projects">projects</a>
            <a href="/vct/">vct</a>
            <a href="/musicelo/">musicelo</a>
            <a href="/contact/" class="active" aria-current="page">contact</a>
        </div>
    </footer>
</body>
</html>
