{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <script src="{% static 'mainsite/theme.js' %}" defer></script>
    <link rel="preload" href="{% static 'fonts/tstar-mono-round.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'mainsite/styles.css' %}">
    <link rel="stylesheet" href="{% static 'vct/vct.css' %}">
    <link rel="icon" href="{% static 'images/foxv1.png' %}" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VCT win probability{% endblock %}</title>
</head>
<body class="page-layout">
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode"></button>
    <header>
        <div class="title">
            <h1>{% block heading %}vct win probability{% endblock %}</h1>
        </div>
    </header>

    <main>
        <div class="vct-content">
            <nav class="vct-nav">
                <a href="{% url 'vct:index' %}">overview</a>
                <a href="{% url 'vct:matches' %}">matches</a>
                <a href="{% url 'vct:stats' %}">stats</a>
                <a href="{% url 'vct:plays' %}">best performances</a>
                <a href="{{ github }}" target="_blank">github</a>
            </nav>
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="bottom-bar">
        <div class="bottom-left">
            <a href="/" class="name">bernie</a>
            <a href="/about/">about</a>
            <a href="/projects">projects</a>
            <a href="/vct/">vct</a>
            <a href="/contact/">contact</a>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
